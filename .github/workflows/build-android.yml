name: Build Penguin Brain APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Gradle wrapper is executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/*.apk PenguinBrain-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PenguinBrain-debug-apk
          path: PenguinBrain-debug.apk

      - name: Publish latest build release
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: Penguin Brain (latest build)
          prerelease: true
          make_latest: true
          body: |
            Automatic debug build of Penguin Brain from commit ${{ github.sha }}.
            Modified by Seraphina (github.com/ismeseraphina, github.com/Cryjai) from MyBrain by mhss1 (GPL-3.0).
            Feedback: https://ismeseraphina.com
          files: PenguinBrain-debug.apk
